# Deployment: started by hand from the GitHub "Actions" tab (Run workflow).
# It needs the secrets and variables listed in docs/DEPLOYMENT.md; until those
# are set this workflow is simply never run.
name: Deploy

on:
  workflow_dispatch:

permissions:
  contents: read

# Never run two deployments at the same time.
concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  test:
    name: Run CI checks first
    uses: ./.github/workflows/ci.yml

  frontend:
    name: Frontend to S3
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Build
        working-directory: frontend
        env:
          # The API URL is compiled into the JavaScript bundle at build time.
          VITE_API_BASE_URL: ${{ vars.VITE_API_BASE_URL }}
        run: |
          npm ci
          npm run build
      - uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ vars.AWS_REGION }}
      - name: Upload to S3
        env:
          BUCKET: ${{ vars.FRONTEND_BUCKET }}
        run: |
          # Hashed asset files never change, so browsers may cache them for a year.
          aws s3 sync frontend/dist "s3://$BUCKET" --delete \
            --exclude index.html --cache-control "public,max-age=31536000,immutable"
          # index.html points at the current asset files, so it must not be cached.
          aws s3 cp frontend/dist/index.html "s3://$BUCKET/index.html" --cache-control "no-cache"

  backend:
    name: Backend to EC2
    needs: test
    runs-on: ubuntu-latest
    steps:
      - name: Deploy over SSH
        env:
          EC2_HOST: ${{ secrets.EC2_HOST }}
          EC2_USER: ${{ secrets.EC2_USER }}
          EC2_SSH_KEY: ${{ secrets.EC2_SSH_KEY }}
          GIT_REF: ${{ github.sha }}
        run: |
          install -m 700 -d ~/.ssh
          printf '%s\n' "$EC2_SSH_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan -H "$EC2_HOST" >> ~/.ssh/known_hosts
          ssh -i ~/.ssh/deploy_key "$EC2_USER@$EC2_HOST" \
            "bash /opt/member-portal/deploy/deploy_backend.sh '$GIT_REF'"
