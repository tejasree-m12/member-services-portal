# nginx site for the API server (EC2).
# Install as /etc/nginx/sites-available/member-portal and link it into sites-enabled.
#
# nginx is the "reverse proxy": it is the only process that listens on the
# public port. It handles slow clients, limits upload size, and passes API
# requests to gunicorn, which listens only on localhost.

server {
    listen 80;
    server_name _;

    # Must be at least Flask's MAX_CONTENT_LENGTH (5 MB) plus form overhead.
    client_max_body_size 6m;

    location /api/ {
        proxy_pass http://127.0.0.1:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }

    # Everything else is not served from this machine: the React app is
    # hosted from S3.
    location / {
        return 404;
    }
}
